<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="logs">
  <main id="page" data-title="Activity Logs">
    <div class="panel">
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h6 class="mb-0 me-auto"><i class="fa-solid fa-list-check text-primary"></i> Activity</h6>
        <select class="form-select form-select-sm w-auto" id="action" aria-label="Filter by action"><option value="">All actions</option></select>
        <button class="btn btn-sm btn-outline-secondary" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div class="table-responsive" id="table"><div class="loading"><i class="fa-solid fa-spinner spin"></i></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
