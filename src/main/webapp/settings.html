<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="settings">
  <main id="page" data-title="Settings">
    <div class="row g-3 mb-3">
      <div class="col-lg-6"><div class="panel">
        <h6><i class="fa-regular fa-user text-primary"></i> Account</h6>
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="avatar" id="acctAvatar" style="width:48px;height:48px;font-size:19px"></div>
          <div><div class="fw-semibold" id="acctName"></div><div class="text-muted small">Signed in on this computer</div></div>
        </div>
        <button class="btn btn-outline-danger" id="settingsLogout" type="button"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div></div>
      <div class="col-lg-6"><div class="panel">
        <h6><i class="fa-solid fa-palette text-primary"></i> Appearance</h6>
        <div class="seg" id="themeSeg" role="group" aria-label="Theme">
          <button type="button" data-theme="light"><i class="fa-solid fa-sun"></i> Light</button>
          <button type="button" data-theme="dark"><i class="fa-solid fa-moon"></i> Dark</button>
          <button type="button" data-theme="system"><i class="fa-solid fa-circle-half-stroke"></i> System</button>
        </div>
        <div class="form-text mt-2">Saved in this browser only.</div>
      </div></div>
    </div>

    <form id="form" class="row g-3" novalidate>
      <div class="col-lg-6">
        <div class="panel">
          <h6><i class="fa-solid fa-folder-tree text-primary"></i> Scanning</h6>
          <div class="mb-3">
            <label class="form-label" for="defaultDir">Default scan directory</label>
            <input class="form-control" id="defaultDir" placeholder="C:\Users\you\Documents" spellcheck="false">
          </div>
          <div class="mb-3">
            <label class="form-label" for="excludedDirs">Excluded directories <span class="text-muted">(one full path per line)</span></label>
            <textarea class="form-control path" id="excludedDirs" rows="4" spellcheck="false"></textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6"><label class="form-label" for="minSize">Minimum file size (KB)</label><input class="form-control" id="minSize" type="number" min="0" step="1"><div class="form-text">0 = no minimum</div></div>
            <div class="col-6"><label class="form-label" for="maxSize">Maximum file size (MB)</label><input class="form-control" id="maxSize" type="number" min="0" step="1"><div class="form-text">0 = no maximum</div></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="hashAlgorithm">Hash algorithm</label>
            <select class="form-select" id="hashAlgorithm"><option>SHA-256</option><option>SHA-512</option></select>
          </div>
          <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="scanHidden"><label class="form-check-label" for="scanHidden">Scan hidden files</label></div>
          <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="scanSystem"><label class="form-check-label" for="scanSystem">Scan system files</label></div>
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="ignoreSystemDirs"><label class="form-check-label" for="ignoreSystemDirs">Automatically ignore common system directories (Windows, Recycle Bin, …)</label></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel">
          <h6><i class="fa-solid fa-box-archive text-warning"></i> Quarantine</h6>
          <div class="mb-3">
            <label class="form-label" for="quarantineDir">Quarantine location</label>
            <input class="form-control path" id="quarantineDir" spellcheck="false">
            <div class="form-text">Duplicates are moved here instead of being deleted. This folder is never scanned. It can only be changed while the quarantine is empty.</div>
          </div>
          <button class="btn btn-primary" id="save" type="submit" data-busy="Saving…"><i class="fa-solid fa-floppy-disk"></i> Save settings</button>
        </div>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
