<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarantine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="quarantine">
  <main id="page" data-title="Quarantine">
    <div class="panel">
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <div class="me-auto"><span class="fw-semibold" id="summary">Loading…</span></div>
        <select class="form-select form-select-sm w-auto" id="status" aria-label="Filter by status">
          <option value="QUARANTINED">In quarantine</option><option value="RESTORED">Restored</option>
          <option value="DELETED">Permanently deleted</option><option value="ALL">All</option>
        </select>
        <button class="btn btn-sm btn-success" id="restoreSel" disabled><i class="fa-solid fa-rotate-left"></i> Restore selected</button>
        <button class="btn btn-sm btn-danger" id="deleteSel" disabled><i class="fa-solid fa-trash"></i> Delete selected</button>
      </div>
      <div class="table-responsive" id="table"><div class="loading"><i class="fa-solid fa-spinner spin"></i></div></div>
      <div class="form-text mt-2">Quarantined files are kept safely on disk until you restore or permanently delete them.</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quarantine.js"></script>
</body>
</html>
