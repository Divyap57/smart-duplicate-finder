<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="analytics">
  <main id="page" data-title="Analytics">
    <div id="empty" class="panel mb-3 d-none"><div class="empty mb-0"><i class="fa-solid fa-chart-line"></i>No data yet. <a href="scan.html">Run a scan</a> to see analytics.</div></div>
    <div class="row g-3">
      <div class="col-lg-6"><div class="panel"><h6>Duplicate storage over scans</h6><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
      <div class="col-lg-6"><div class="panel"><h6>Files scanned over time</h6><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
      <div class="col-lg-6"><div class="panel"><h6>Duplicate files over time</h6><div class="chart-box"><canvas id="c3"></canvas></div></div></div>
      <div class="col-lg-6"><div class="panel"><h6>Storage recovered (quarantined or deleted, per day)</h6><div class="chart-box"><canvas id="c4"></canvas></div></div></div>
      <div class="col-lg-5"><div class="panel"><h6>File types (latest scan)</h6><div class="chart-box tall"><canvas id="c5"></canvas></div></div></div>
      <div class="col-lg-7"><div class="panel"><h6>Largest duplicate groups (recoverable space)</h6><div class="chart-box tall"><canvas id="c6"></canvas></div></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
