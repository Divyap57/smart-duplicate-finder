<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="scan">
  <main id="page" data-title="Scan Files">
    <section class="scan-hero mb-4">
      <div class="big-ico"><i class="fa-solid fa-folder-tree"></i></div>
      <h5>Choose a folder or drive to scan</h5>
      <p class="text-muted mb-0">We compare files by content, never by name, and nothing is changed until you decide.</p>
      <div class="picker">
        <div class="input-group input-group-lg">
          <span class="input-group-text"><i class="fa-regular fa-folder-open"></i></span>
          <input type="text" class="form-control" id="folder" placeholder="C:\Users\you\Documents" autocomplete="off" spellcheck="false">
          <button class="btn btn-outline-secondary" id="browseBtn" type="button"><i class="fa-solid fa-folder-plus"></i> Select Folder</button>
          <button class="btn btn-primary" id="startBtn" type="button" data-busy="Starting…"><i class="fa-solid fa-play"></i> Scan</button>
        </div>
        <div class="form-text mt-2">Excluded folders, size limits and hashing live in <a href="settings.html">Settings</a>.</div>
      </div>
    </section>

    <div class="panel d-none" id="progressPanel">
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h6 class="mb-0 flex-grow-1"><i class="fa-solid fa-gauge text-primary"></i> Scan <span id="scanNo"></span> <span id="statusBadge"></span></h6>
        <button class="btn btn-warning btn-sm" id="pauseBtn"><i class="fa-solid fa-pause"></i> Pause</button>
        <button class="btn btn-success btn-sm d-none" id="resumeBtn"><i class="fa-solid fa-play"></i> Resume</button>
        <button class="btn btn-outline-danger btn-sm" id="cancelBtn"><i class="fa-solid fa-xmark"></i> Cancel</button>
      </div>

      <div class="progress mb-1" role="progressbar" aria-label="Scan progress">
        <div class="progress-bar" id="bar" style="width:0%"></div>
      </div>
      <div class="d-flex justify-content-between text-muted small mb-3">
        <span id="phaseText"></span><span id="percentText"></span>
      </div>

      <div class="row g-3 mb-3" id="statGrid"></div>

      <div class="small mb-1"><span class="text-muted">Current folder:</span> <span class="path" id="curFolder">—</span></div>
      <div class="small mb-2"><span class="text-muted">Current file:</span> <span class="path" id="curFile">—</span></div>

      <div id="doneMsg" class="alert d-none mb-0"></div>
      <div id="resultActions" class="d-none mt-3 d-flex flex-wrap gap-2">
        <a class="btn btn-primary" href="duplicates.html"><i class="fa-solid fa-clone"></i> Review duplicates</a>
        <a class="btn btn-light" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
