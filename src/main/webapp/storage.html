<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="storage">
  <main id="page" data-title="Storage">
    <div id="empty" class="panel d-none"><div class="empty mb-0"><i class="fa-solid fa-hard-drive"></i>No scan results yet. <a href="scan.html">Start a scan</a> to analyse your storage.</div></div>
    <div id="storageBody">
      <div class="row g-3 mb-3" id="sCards"></div>
      <div class="panel mb-3">
        <h6><i class="fa-solid fa-gauge text-primary"></i> Storage indicator</h6>
        <div class="meter"><span id="mNeeded" style="width:0;background:#6366f1"></span><span id="mDup" style="width:0;background:#f59e0b"></span></div>
        <div class="meter-legend"><span><i style="background:#6366f1"></i>Needed <b id="lNeeded"></b></span><span><i style="background:#f59e0b"></i>Duplicate storage you can recover <b id="lDup"></b></span></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-lg-5"><div class="panel"><h6><i class="fa-solid fa-chart-pie text-primary"></i> Space by file type</h6><div class="chart-box"><canvas id="chTypes"></canvas></div></div></div>
        <div class="col-lg-7"><div class="panel"><h6><i class="fa-solid fa-folder text-warning"></i> Biggest folders</h6><div id="folders"></div></div></div>
      </div>
      <div class="panel"><h6><i class="fa-solid fa-weight-hanging text-danger"></i> Largest files</h6><div class="table-responsive" id="largest"></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
</body>
</html>
