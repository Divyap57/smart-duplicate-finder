<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body data-page="history">
  <main id="page" data-title="Scan History">
    <div class="panel">
      <div class="d-flex align-items-center mb-3">
        <h6 class="mb-0 me-auto"><i class="fa-solid fa-clock-rotate-left text-primary"></i> All scans</h6>
        <button class="btn btn-sm btn-outline-secondary" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </div>
      <div class="table-responsive" id="table"><div class="loading"><i class="fa-solid fa-spinner spin"></i></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
